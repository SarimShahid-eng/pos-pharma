models:
  Supplier:
    name: string
    phone_number: string nullable
    opening_balance: decimal:12,2 default:0
    current_balance: decimal:12,2 default:0
    timestamps: true
    relationships:
      hasMany: Purchase, SupplierPayment, PurchaseReturn

  Product:
    barcode: string unique index
    label_title: string nullable
    name: string
    unit: string default:pcs
    cost_price: decimal:12,2 default:0
    sale_price: decimal:12,2 default:0
    discount: decimal:12,2 default:0
    profit: decimal:12,2 default:0
    stock_qty: decimal:12,2 default:0
    timestamps: true
    relationships:
      hasMany: ProductHistory, PurchaseItem, SaleItem, PurchaseReturnItem, SaleReturnItem

  Purchase:
    invoice_number: string unique index
    reference_number: string nullable
    supplier_id: id foreign:suppliers.id
    total_amount: decimal:12,2
    discount_amount: decimal:12,2 default:0
    paid_amount: decimal:12,2 default:0
    remaining_amount: decimal:12,2 default:0
    date: date
    notes: text nullable
    timestamps: true
    relationships:
      belongsTo: Supplier
      hasMany: PurchaseItem, PurchaseReturn, SupplierPayment

  PurchaseItem:
    purchase_id: id foreign:purchases.id ondelete:cascade
    product_id: id foreign:products.id
    qty: decimal:12,2
    bonus_qty: decimal:12,2 default:0
    rate: decimal:12,2
    amount: decimal:12,2
    timestamps: true
    relationships:
      belongsTo: Purchase, Product

  Sale:
    invoice_number: string unique index
    total_amount: decimal:12,2
    discount_amount: decimal:12,2 default:0
    net_amount: decimal:12,2
    received_amount: decimal:12,2 default:0
    change_given: decimal:12,2 default:0
    payment_method: enum:cash,card,bank default:cash
    date: date
    timestamps: true
    relationships:
      hasMany: SaleItem, SaleReturn

  SaleItem:
    sale_id: id foreign:sales.id ondelete:cascade
    product_id: id foreign:products.id
    qty: decimal:12,2
    rate: decimal:12,2
    discount: decimal:12,2 default:0
    after_discount_price: decimal:12,2
    amount: decimal:12,2
    timestamps: true
    relationships:
      belongsTo: Sale, Product

  SupplierPayment:
    supplier_id: id foreign:suppliers.id
    payment_method: enum:cash,bank default:cash
    amount: decimal:12,2
    purchase_id: foreign:purchases,id nullable
    reference_no: string nullable
    date: date
    notes: text nullable
    timestamps: true
    relationships:
      belongsTo: Supplier, Purchase

  PurchaseReturn:
    purchase_id: id foreign:purchases.id
    supplier_id: id foreign:suppliers.id
    total_amount: decimal:12,2
    date: date
    notes: text nullable
    timestamps: true
    relationships:
      belongsTo: Purchase, Supplier
      hasMany: PurchaseReturnItem

  PurchaseReturnItem:
    purchase_return_id: id foreign:purchase_returns.id ondelete:cascade
    product_id: id foreign:products.id
    qty: decimal:12,2
    rate: decimal:12,2
    amount: decimal:12,2
    timestamps: true
    relationships:
      belongsTo: PurchaseReturn, Product

  SaleReturn:
    sale_id: id foreign:sales.id
    total_amount: decimal:12,2
    refunded_amount: decimal:12,2 default:0
    date: date
    notes: text nullable
    timestamps: true
    relationships:
      belongsTo: Sale
      hasMany: SaleReturnItem

  SaleReturnItem:
    sale_return_id: id foreign:sale_returns.id ondelete:cascade
    product_id: id foreign:products.id
    qty: decimal:12,2
    rate: decimal:12,2
    amount: decimal:12,2
    timestamps: true
    relationships:
      belongsTo: SaleReturn, Product

  ProductHistory:
    product_id: id foreign:products.id
    qty: decimal:12,2
    type: enum:purchase,sale,purchase_return,sale_return,adjustment
    reference_id: integer nullable
    reference_type: string nullable
    timestamps: true
    relationships:
      belongsTo: Product
